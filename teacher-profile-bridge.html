<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Preparing Teacher workspace</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf2f8;color:#172033;font:16px/1.5 Arial,sans-serif}
    main{width:min(100%,430px);padding:32px;border:1px solid #cbd5e1;border-radius:18px;background:#fff;box-shadow:0 24px 70px #17203326}
    h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#536176}
  </style>
</head>
<body>
  <main>
    <h1>Preparing Teacher workspace…</h1>
    <p>This private hand-off prevents the Teacher browser from appearing in the learner device count.</p>
  </main>
  <script>
    (function () {
      'use strict';
      var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwz64jQW8YH6CEgH-GK4ieTyiJD40h5ro3udAQEr96j7dtqh9dgphwO-FmZyiSCXnUi/exec';
      var TEACHER_DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbwVGHa-KvFycCMkrFAAgvl7An2zz-a3QNIMcug1CM2ZbUQIpOYjZgShN8JcvMrlloSx/exec?view=teacher';
      var PRESENCE_DEVICE_KEY = 'joy-live-presence-device-v1';
      var TEACHER_PROFILE_KEY = 'joy-teacher-profile-v1';
      var parameters = new URLSearchParams(window.location.hash.slice(1));
      var token = parameters.get('token') || '';
      var requestedReturn = parameters.get('return') || '';
      var returnUrl = requestedReturn.indexOf(TEACHER_DASHBOARD_URL) === 0
        ? requestedReturn
        : TEACHER_DASHBOARD_URL + '&presenceReady=1';
      var deviceId = '';

      try {
        localStorage.setItem(TEACHER_PROFILE_KEY, 'teacher');
        deviceId = localStorage.getItem(PRESENCE_DEVICE_KEY) || '';
        localStorage.removeItem(PRESENCE_DEVICE_KEY);
      } catch (error) {}

      if (!token) {
        window.location.replace(returnUrl);
        return;
      }

      try {
        window.fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'markTeacherProfilePresence',
            teacherPresenceToken: token,
            deviceId: deviceId
          }),
          keepalive: true
        }).finally(function () {
          window.location.replace(returnUrl);
        });
      } catch (error) {
        window.location.replace(returnUrl);
      }
    }());
  </script>
</body>
</html>
